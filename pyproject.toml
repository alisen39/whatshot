[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whats-hot-api"
version = "0.1.0"
description = "An API for aggregating trending lists and breaking-news feeds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.2,<9",
    "defusedxml>=0.7.1",
    "fastapi>=0.135.2",
    "feedgen>=1.0.0",
    "httpx[http2]>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "orjson>=3.11.7",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6,<7",
    "quickjs>=1.19.4",
    "redis[hiredis]>=7.4.0",
    "uvicorn[standard]>=0.42.0",
    "wcwidth>=0.2,<1",
]

[project.scripts]
whats-hot-api = "whats_hot_api.__main__:main"
whatshot = "whats_hot_api.cli.main:main"
whatshot-mcp = "whats_hot_api.mcp.stdio_proxy:main"

[project.optional-dependencies]
history = [
    "duckdb>=1.5,<2",
    "pytz>=2025.2",
]
mcp = [
    "mcp>=2,<3",
]
daemon = [
    "duckdb>=1.5,<2",
    "mcp>=2,<3",
    "pytz>=2025.2",
]
[dependency-groups]
dev = [
    "duckdb>=1.5,<2",
    "mcp>=2,<3",
    "pytz>=2025.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["whats_hot_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 20
markers = [
    "unit: isolated test with no external services",
    "integration: test that crosses process, database, or application boundaries",
    "e2e: end-to-end test against a running stack",
]
